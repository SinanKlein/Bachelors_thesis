# =============================================================================
# Pipeline configuration
# =============================================================================
# Everything that changes between runs lives here. Code never hardcodes values.

# --- Preprocessing -----------------------------------------------------------
preprocess:
  reducer: mean_variance         # one of: mean_variance, identity  (later: svd)
  # Per-source keep-fraction (top quantile by variance score).
  # A single number still works and applies to every source; a mapping lets you
  # set a different fraction per feature matrix.
  quantile:
    Xb: 0.05                     # bacteria: keep top 5% by variance
    Xv: 0.20                     # virus:    keep top 20% by variance
  apply_to:                      # which feature matrices in graph_data.npz to filter
    - Xb
    - Xv
  # Variance is computed on raw counts. The selected features are then CLR-transformed.
  standardize: false             # kept only for old configs; ignored by the reducer
  clr_pseudocount: 0.5           # add before centered log-ratio transformation

# --- Resampling --------------------------------------------------------------
resampling:
  n_outer: 10
  n_inner: 0                     # no inner CV; only 10 train/test splits
  stratify: true                 # stratify on the y task label
  seed: 42

# --- Tasks -------------------------------------------------------------------
# Each task has a `task_type` that drives which models / metrics are used.
#   binary     : classifiers, predict_proba, AUC/AP/Brier + cutoff sweep
#   regression : regressors, predict, R2/MSE/MAE
#
# label_source = key in graph_data.npz holding the label
# mask_source  = optional key holding 0/1 mask (only rows with mask=1 are used)
# binarize     = if true, label is converted to (label > 0).astype(int)
tasks:
  - name: y
    task_type: binary
    label_source: Y_binary
    mask_source: null

  - name: w_reg
    task_type: regression
    label_source: W_continuous
    mask_source: Mask_observed
    binarize: false              # use the raw continuous W
    transform: logit             # target transform for W only; feature log1p transform is removed

  - name: w_class
    task_type: binary
    label_source: W_continuous   # binarize the continuous glasso edge probability
    mask_source: Mask_observed
    binarize: true
    binarize_threshold: 0.5      # w_class = 1[W > 0.5] (W is an edge probability in (0,1))

# --- Models (plug and play) --------------------------------------------------
# Each model has a `task_type` so the experiment only runs it on matching tasks.
# Adding a model = one entry here + one class in models.py registry.
models:
  - name: sparse_logistic
    class: sparse_logistic
    task_type: binary
    params:
      C: 1.0
      penalty: l1
      solver: liblinear
      max_iter: 2000

  - name: xgb_clf
    class: xgb_clf
    task_type: binary
    params:
      n_estimators: 500
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8

  - name: mlp_clf
    class: mlp_clf
    task_type: binary
    params:
      hidden_dim: 64
      dropout: 0.3
      batch_size: 512
      lr: 3.0e-4
      weight_decay: 1.0e-3
      n_epochs: 200

  - name: twotower_y_only
    class: twotower_y_only
    task_type: binary
    params:
      latent_dim: 5
      hidden_dim: 64
      dropout: 0.3
      batch_size: 512
      lr: 3.0e-4
      weight_decay: 1.0e-3
      n_epochs: 200
      lambda_y: 1.0

  - name: linreg
    class: linreg
    task_type: regression
    params:
      alpha: 1.0                 # ridge regularization (alpha=0 -> OLS)

  - name: xgb_reg
    class: xgb_reg
    task_type: regression
    params:
      n_estimators: 500
      max_depth: 4
      learning_rate: 0.05
      subsample: 0.8
      colsample_bytree: 0.8

  - name: mlp_reg
    class: mlp_reg
    task_type: regression
    params:
      hidden_dim: 64
      dropout: 0.3
      batch_size: 512
      lr: 3.0e-4
      weight_decay: 1.0e-3
      n_epochs: 200

  - name: twotower_w_only
    class: twotower_w_only
    task_type: regression
    params:
      latent_dim: 5
      hidden_dim: 64
      dropout: 0.3
      batch_size: 512
      lr: 3.0e-4
      weight_decay: 1.0e-3
      n_epochs: 200
      lambda_w: 1.0

  - name: twotower_yw_joint
    class: twotower_yw_joint
    task_type: joint_y_w
    params:
      latent_dim: 5
      hidden_dim: 64
      dropout: 0.3
      batch_size: 512
      lr: 3.0e-4
      weight_decay: 1.0e-3
      n_epochs: 200
      lambda_y: 1.0
      lambda_w: 1.0

  - name: mlp_yw_joint
    class: mlp_yw_joint
    task_type: joint_y_w
    params:
      hidden_dim: 64            # the shared post-ReLU hidden trunk is the joint latent
      dropout: 0.3
      batch_size: 512
      lr: 3.0e-4
      weight_decay: 1.0e-3
      n_epochs: 200
      lambda_y: 1.0
      lambda_w: 1.0

# --- Evaluation --------------------------------------------------------------
evaluation:
  cutoff_grid_start: 0.01
  cutoff_grid_stop: 0.99
  cutoff_grid_step: 0.01
  log_train_metrics: true        # emit role="train" rows -> generalization-gap plots
  logit_eps: 1.0e-3             # clip used by the W logit target transform: clip(W, eps, 1-eps)

# --- Logging -----------------------------------------------------------------
logging:
  verbosity: 1                   # 0 = silent, 1 = per outer fold, 2 = per inner fold

# --- Block 2: W-threshold AUC sweep (slide 21) -------------------------------
# For 10 evenly spaced interior thresholds t in (0,1), fit an L2 ("ridge-style")
# logistic on X predicting 1[W > t] and score test AUC over the 10 outer splits.
# Only AUC is needed, so L2 + lbfgs replaces the old L1/liblinear model (much
# faster). Fits run in parallel via joblib (n_jobs=-1 uses all cores).
w_threshold:
  enabled: true
  w_task: w_reg          # task whose continuous y holds the W edge probabilities
  n_cuts: 10             # number of evenly spaced interior thresholds in (0,1)
  solver: lbfgs          # fast L2 solver; alternatives: newton-cg, saga
  C: 1.0
  max_iter: 1000
  n_jobs: 2

# --- Block 3: lasso stability selection --------------------------------------
# Meinshausen-Buhlmann stability selection: B subsamples of size frac*n drawn
# WITHOUT replacement, an L1 (lasso) logistic fit on each, and the per-feature
# fraction of fits with a non-zero coefficient = selection frequency. Bootstraps
# run in parallel via joblib. Wall time ~= B * per_fit / n_cores.
stability:
  enabled: true
  task: y                # which binary task to select features for
  n_bootstrap: 50       # B subsamples
  subsample_frac: 0.5    # subsample size = frac * n_observed (no replacement)
  C: 0.1                 # smaller C => stronger L1 penalty => sparser
  solver: liblinear      # L1 logistic solver (liblinear or saga)
  max_iter: 2000
  pi_threshold: 0.6      # selection-frequency cutoff for "stably selected"
  n_jobs: 2
