preprocess:
  selection: equal_dim
  transform: presence_absence
  combine: sum
  reducer: mean_variance
  quantile:
    Xb: 0.025
    Xv: 0.1
  apply_to:
  - Xb
  - Xv
  standardize: false
  clr_pseudocount: 0.5
resampling:
  n_outer: 10
  n_inner: 0
  stratify: true
  seed: 42
tasks:
- name: y
  task_type: binary
  label_source: Y_binary
  mask_source: Mask_observed
- name: w_reg
  task_type: regression
  label_source: W_continuous
  mask_source: Mask_observed
  binarize: false
  transform: logit
- name: w_class
  task_type: binary
  label_source: W_continuous
  mask_source: Mask_observed
  binarize: true
  binarize_threshold: 0.0
models:
- name: sparse_logistic
  class: sparse_logistic
  task_type: binary
  params:
    C: 1.0
    penalty: l1
    solver: liblinear
    max_iter: 2000
- name: xgb_clf
  class: xgb_clf
  task_type: binary
  params:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
- name: linreg
  class: linreg
  task_type: regression
  params:
    alpha: 1.0
- name: xgb_reg
  class: xgb_reg
  task_type: regression
  params:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
- name: mlp_clf_y
  class: mlp_clf
  task_type: binary
  target_task: y
  params:
    hidden_dim: 64
    dropout: 0.3
    batch_size: 512
    lr: 0.0003
    weight_decay: 0.001
    n_epochs: 200
- name: mlp_clf_w_class
  class: mlp_clf
  task_type: binary
  target_task: w_class
  params:
    hidden_dim: 64
    dropout: 0.3
    batch_size: 512
    lr: 0.0003
    weight_decay: 0.001
    n_epochs: 200
- name: mlp_reg
  class: mlp_reg
  task_type: regression
  target_task: w_reg
  params:
    hidden_dim: 64
    dropout: 0.3
    batch_size: 512
    lr: 0.0003
    weight_decay: 0.001
    n_epochs: 200
- name: mlp_latent_y
  class: mlp_clf
  task_type: binary
  target_task: y
  params:
    hidden_dim: 64
    dropout: 0.3
    batch_size: 512
    lr: 0.0003
    weight_decay: 0.001
    n_epochs: 200
- name: mlp_latent_w_class
  class: mlp_clf
  task_type: binary
  target_task: w_class
  params:
    hidden_dim: 64
    dropout: 0.3
    batch_size: 512
    lr: 0.0003
    weight_decay: 0.001
    n_epochs: 200
- name: mlp_latent_yw
  class: mlp_yw_joint
  task_type: joint_y_w
  params:
    hidden_dim: 64
    dropout: 0.3
    batch_size: 512
    lr: 0.0003
    weight_decay: 0.001
    n_epochs: 200
    lambda_y: 1.0
    lambda_w: 1.0
evaluation:
  cutoff_grid_start: 0.01
  cutoff_grid_stop: 0.99
  cutoff_grid_step: 0.01
  logit_eps: 0.001
logging:
  verbosity: 1
w_threshold:
  enabled: true
  w_task: w_reg
  n_cuts: 10
  solver: lbfgs
  C: 1.0
  max_iter: 1000
  n_jobs: 2
  run_xgboost: true
  xgb_params:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
ablation:
  enabled: true
  anchor: 4_full_presence_sum_equaldim
  tasks:
  - y
  - w_class
  models:
  - sparse_logistic
  - xgb_clf
  - mlp_clf_y
  - mlp_clf_w_class
  arms:
  - name: 1_baseline_clr_concat_quantile
    transform: clr
    selection: quantile
    combine: concat
  - name: 2_presence_concat_quantile
    transform: presence_absence
    selection: quantile
    combine: concat
  - name: 3_presence_concat_equaldim
    transform: presence_absence
    selection: equal_dim
    combine: concat
  - name: 4_full_presence_sum_equaldim
    transform: presence_absence
    selection: equal_dim
    combine: sum
  family:
    enabled: true
    primary_truth: majority
